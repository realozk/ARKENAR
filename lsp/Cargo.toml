[package]
name = "arkenar-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server that flags hardcoded secrets as you type."
license = "MIT"
repository = "https://github.com/RealOzk/ARKENAR"

[[bin]]
name = "arkenar-lsp"
path = "src/main.rs"

[dependencies]
arkenar-secrets = { path = "../secrets" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
