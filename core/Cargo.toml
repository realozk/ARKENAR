[package]
name = "arkenar-core"
version = "1.2.0"
edition = "2021"
description = "Core library for the Arkenar vulnerability scanner."
license = "MIT"
repository = "https://github.com/RealOzk/ARKENAR"
homepage = "https://github.com/RealOzk/ARKENAR"

[dependencies]
arkenar-secrets = { path = "../secrets" }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.5"
rand = { version = "0.9.2", features = ["std", "thread_rng"] }
async-trait = "0.1"
futures = "0.3"
url = "2.5"
colored = "2.0"
anyhow = "1.0"
indicatif = "0.17"
which = "8.0.0"
zip = "2"
flate2 = "1.1.9"
tar = "0.4.44"
percent-encoding = "2.3"
dirs = "5"
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
sha2 = "0.10"
