name: "Arkenar Security Scan"
description: "Scan a running app / preview URL for leaked secrets and web vulnerabilities; gate the pull request."
author: "RealOzk"
branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "URL to scan (e.g. your preview/staging deployment)"
    required: true
  mode:
    description: "Scan mode: simple | advanced"
    required: false
    default: "simple"
  fail-on:
    description: "Fail the job if a finding at/above this severity is found: none|low|medium|high|critical"
    required: false
    default: "high"
  sarif-file:
    description: "Path to write the SARIF report (upload it with github/codeql-action/upload-sarif)"
    required: false
    default: "arkenar.sarif"
  webhook-url:
    description: "Optional Slack/Discord webhook for alerts"
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"
