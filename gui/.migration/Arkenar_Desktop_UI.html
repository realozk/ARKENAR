<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Arkenar — Exploit Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #0b0b0d;
            --bg-2: #0f0f12;
            --panel: #121215;
            --panel-2: #16161b;
            --line: #1f1f24;
            --line-2: #26262c;
            --text: #d4d4d8;
            --muted: #6b7280;
            --ghost: #4b5563;
            --accent: #f97316;
            /* orange */
            --accent-2: #fb923c;
            --accent-w: #7c2d12;
            --ok: #22c55e;
            --warn: #eab308;
            --err: #ef4444;
        }

        html,
        body,
        #root {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        body {
            -webkit-font-smoothing: antialiased;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .chrome {
            user-select: none;
            -webkit-user-select: none;
        }

        .mono {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a30;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a42;
        }

        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        .b {
            border: 1px solid var(--line);
        }

        .bt {
            border-top: 1px solid var(--line);
        }

        .bb {
            border-bottom: 1px solid var(--line);
        }

        .bl {
            border-left: 1px solid var(--line);
        }

        .br {
            border-right: 1px solid var(--line);
        }

        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        .focus-accent:focus-within {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 0.5px var(--accent);
        }

        /* Editor colors */
        .tok-key {
            color: #93c5fd;
        }

        .tok-str {
            color: #86efac;
        }

        .tok-num {
            color: #c4b5fd;
        }

        .tok-bool {
            color: #fbbf24;
        }

        .tok-punct {
            color: #52525b;
        }

        .tok-kw {
            color: var(--accent);
            font-weight: 600;
        }

        .tok-ver {
            color: #71717a;
        }

        .tok-hdr {
            color: #fdba74;
        }

        .tok-hdrv {
            color: #d4d4d8;
        }

        .tok-path {
            color: #e4e4e7;
        }

        .tok-inj {
            color: #fca5a5;
            background: rgba(239, 68, 68, .12);
            padding: 0 2px;
            border-radius: 2px;
        }

        .tok-cm {
            color: #52525b;
            font-style: italic;
        }

        .pre-code {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 11.5px;
            line-height: 1.6;
            white-space: pre;
        }

        /* Utility */
        .hairline {
            background: var(--line);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        /* ===== ICONS (thin stroke) ===== */
        const I = ({ d, s = 13, w = 1.5, f = "none", cls = "", children }) => (
            <svg width={s} height={s} viewBox="0 0 24 24" fill={f} stroke="currentColor" strokeWidth={w} strokeLinecap="round" strokeLinejoin="round" className={cls}>
                {d && <path d={d} />}{children}
            </svg>
        );
        const IBasic = p => <I {...p}><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 9h18M7 14h4M7 17h7" /></I>;
        const IStudio = p => <I {...p}><path d="m7 8-4 4 4 4M17 8l4 4-4 4M14 4l-4 16" /></I>;
        const IRecon = p => <I {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></I>;
        const IChev = p => <I {...p}><path d="m6 9 6 6 6-6" /></I>;
        const IPlus = p => <I {...p}><path d="M12 5v14M5 12h14" /></I>;
        const ISearch = p => <I {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></I>;
        const IPlay = p => <I {...p} f="currentColor" w={0}><path d="M6 4l14 8-14 8z" /></I>;
        const IStop = p => <I {...p} f="currentColor" w={0}><rect x="6" y="6" width="12" height="12" rx="1" /></I>;
        const ISidebar = p => <I {...p}><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M9 4v16" /></I>;
        const IInfo = p => <I {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8h.01M11 12h1v4h1" /></I>;
        const ICog = p => <I {...p}><circle cx="12" cy="12" r="3" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></I>;
        const IMin = p => <I {...p}><path d="M5 12h14" /></I>;
        const ISquare = p => <I {...p}><rect x="4" y="4" width="16" height="16" /></I>;
        const IX = p => <I {...p}><path d="M6 6l12 12M18 6L6 18" /></I>;
        const ICopy = p => <I {...p}><rect x="9" y="9" width="12" height="12" rx="1" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></I>;
        const IFmt = p => <I {...p}><path d="M4 6h16M4 12h10M4 18h16" /></I>;
        const IWrap = p => <I {...p}><path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4M3 18h4M7 15l-4 3 4 3" /></I>;
        const ISave = p => <I {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8" /></I>;
        const IBolt = p => <I {...p} f="currentColor" w={0}><path d="M13 2L4 14h7l-1 8 9-12h-7z" /></I>;
        const ITrash = p => <I {...p}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13M9 7V4h6v3" /></I>;
        const IDot = p => <I {...p} f="currentColor" w={0}><circle cx="12" cy="12" r="5" /></I>;

        /* ============================================================
           TITLEBAR (single row — matches tool: window ctrls left, wordmark,
           centered segmented BASIC/STUDIO/RECON, right: status + engine)
           ============================================================ */
        function TitleBar({ tab, setTab, running }) {
            return (
                <div className="chrome h-11 shrink-0 bb flex items-center relative" style={{ background: "var(--bg-2)" }}>
                    {/* left: macOS traffic lights + icon controls (matches your 3 header icons) */}
                    <div className="flex items-center pl-3 pr-2 gap-[7px]">
                        <span className="w-[11px] h-[11px] rounded-full bg-[#ff5f57]" />
                        <span className="w-[11px] h-[11px] rounded-full bg-[#febc2e]" />
                        <span className="w-[11px] h-[11px] rounded-full bg-[#28c840]" />
                    </div>
                    <div className="flex items-center gap-0.5 pl-1 pr-2">
                        {[ISidebar, IInfo, ICog].map((Ic, i) => (
                            <button key={i} className="w-6 h-6 flex items-center justify-center text-[color:var(--muted)] hover:text-[color:var(--text)] hover:bg-[color:var(--panel-2)] rounded-sm">
                                <Ic s={13} />
                            </button>
                        ))}
                    </div>
                    {/* wordmark */}
                    <div className="pl-1 pr-3 flex items-center gap-2">
                        <span className="mono text-[12px] font-bold tracking-[0.22em]" style={{ color: "var(--accent)" }}>ARKENAR</span>
                    </div>

                    {/* centered segmented */}
                    <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
                        <div className="flex items-stretch b rounded" style={{ background: "var(--bg)" }}>
                            {[
                                { k: "basic", l: "BASIC", ic: IBasic },
                                { k: "studio", l: "STUDIO", ic: IStudio },
                                { k: "recon", l: "RECON", ic: IRecon },
                            ].map(t => {
                                const on = tab === t.k, Ic = t.ic;
                                return (
                                    <button key={t.k} onClick={() => setTab(t.k)}
                                        className={"px-4 h-7 flex items-center gap-1.5 mono text-[11px] tracking-[0.18em] " +
                                            (on ? "text-white" : "text-[color:var(--muted)] hover:text-[color:var(--text)]")}
                                        style={on ? { background: "rgba(249,115,22,0.12)", color: "var(--accent-2)" } : {}}>
                                        <Ic s={12} />
                                        <span>{t.l}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex-1" />

                    {/* right: status + engine + windows controls */}
                    <div className="flex items-center gap-2 pr-2">
                        <div className="flex items-center gap-1.5 mono text-[10.5px] tracking-[0.2em]">
                            <span className={running ? "text-[color:var(--ok)]" : "text-[color:var(--muted)]"} style={{ textShadow: running ? "0 0 6px rgba(34,197,94,.5)" : "none" }}>●</span>
                            <span style={{ color: running ? "var(--ok)" : "var(--muted)" }}>{running ? "RUNNING" : "IDLE"}</span>
                        </div>
                        <button className="h-7 px-3 flex items-center gap-1.5 mono text-[10.5px] tracking-[0.18em] text-white" style={{ background: "var(--accent)" }}>
                            <IBolt s={11} /> <span>EXECUTE ENGINE</span>
                        </button>
                        <div className="flex items-stretch">
                            <button className="w-8 h-7 flex items-center justify-center text-[color:var(--muted)] hover:bg-[color:var(--panel-2)]"><IMin s={12} /></button>
                            <button className="w-8 h-7 flex items-center justify-center text-[color:var(--muted)] hover:bg-[color:var(--panel-2)]"><ISquare s={10} /></button>
                            <button className="w-8 h-7 flex items-center justify-center text-[color:var(--muted)] hover:bg-[color:var(--err)] hover:text-white"><IX s={12} /></button>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================================================
           STATUS STRIP (the thin ribbon under your titlebar in Studio)
           ============================================================ */
        function StatusStrip({ dirty = true }) {
            return (
                <div className="h-6 shrink-0 bb flex items-center justify-between px-3 mono text-[10px] tracking-[0.14em]" style={{ background: "var(--bg-2)" }}>
                    <div className="flex items-center gap-4">
                        <span className="flex items-center gap-1.5" style={{ color: dirty ? "var(--accent)" : "var(--muted)" }}>
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: "var(--accent)" }} />DRAFT
                        </span>
                        <span className="text-[color:var(--muted)]">· UNSAVED</span>
                        <span className="text-[color:var(--muted)]">· UNSENT</span>
                        <span className="text-[color:var(--muted)]">· MUTATED</span>
                        <span className="text-[color:var(--muted)]">STATUS <span className="text-[color:var(--text)]">idle</span></span>
                        <span className="text-[color:var(--muted)]">TIME <span className="text-[color:var(--text)]">—</span></span>
                        <span className="text-[color:var(--muted)]">REQ <span className="text-[color:var(--text)]">12</span></span>
                        <span className="text-[color:var(--muted)]">RPS <span className="text-[color:var(--text)]">18</span></span>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="text-[color:var(--muted)]">scope <span className="text-[color:var(--text)]">api.target-lab.internal</span></span>
                        <span className="text-[color:var(--muted)]">proxy <span className="text-[color:var(--text)]">127.0.0.1:8080</span></span>
                        <button className="h-5 px-2 b text-[color:var(--muted)] hover:text-[color:var(--text)] flex items-center gap-1.5 rounded-sm">
                            <ITrash s={10} /> <span>Clear Findings</span>
                        </button>
                    </div>
                </div>
            );
        }

        /* ============================================================
           ACTION BAR (Method, URL, Send, mutate meta) — above the 3 cols
           ============================================================ */
        const METHODS = [
            { m: "GET", c: "#22c55e" }, { m: "POST", c: "#f97316" }, { m: "PUT", c: "#3b82f6" },
            { m: "DEL", c: "#ef4444" }, { m: "PATCH", c: "#a855f7" }, { m: "HEAD", c: "#9ca3af" }, { m: "OPT", c: "#9ca3af" },
        ];
        function MethodDD({ value, onChange }) {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h);
            }, []);
            const cur = METHODS.find(x => x.m === value) || METHODS[0];
            return (
                <div ref={ref} className="relative">
                    <button onClick={() => setOpen(o => !o)} className="h-7 px-2 pr-1.5 flex items-center gap-1.5 b rounded-sm mono text-[11px]" style={{ background: "var(--panel)" }}>
                        <span className="font-bold" style={{ color: cur.c }}>{cur.m}</span>
                        <IChev s={10} cls="text-[color:var(--muted)]" />
                    </button>
                    {open && (
                        <div className="absolute left-0 top-full mt-0.5 w-24 b rounded-sm z-20 py-0.5" style={{ background: "var(--panel)" }}>
                            {METHODS.map(m => (
                                <button key={m.m} onClick={() => { onChange(m.m); setOpen(false); }}
                                    className="w-full text-left px-2 py-0.5 mono text-[11px] hover:bg-[color:var(--panel-2)] flex items-center justify-between">
                                    <span className="font-bold" style={{ color: m.c }}>{m.m}</span>
                                    {value === m.m && <IDot s={6} cls="text-[color:var(--accent)]" />}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function ActionBar({ method, setMethod, url, setUrl }) {
            return (
                <div className="h-10 shrink-0 bb flex items-center gap-2 px-2" style={{ background: "var(--bg-2)" }}>
                    <MethodDD value={method} onChange={setMethod} />
                    <div className="flex-1 min-w-0 h-7 flex items-stretch b rounded-sm focus-accent" style={{ background: "var(--panel)" }}>
                        <div className="flex items-center pl-2 pr-1 text-[color:var(--ghost)]"><ISearch s={11} /></div>
                        <input value={url} onChange={e => setUrl(e.target.value)} spellCheck={false}
                            placeholder="https://target.com/api/endpoint"
                            className="flex-1 min-w-0 bg-transparent mono text-[11.5px] placeholder-[color:var(--ghost)] outline-none" />
                        <div className="flex items-center gap-1.5 px-2 bl mono text-[10px] text-[color:var(--muted)]">
                            <span style={{ color: "#fca5a5" }}>§payload§</span>
                            <span className="text-[color:var(--line-2)]">|</span>
                            <span>§reqid§</span>
                            <span className="text-[color:var(--line-2)]">|</span>
                            <span>§token§</span>
                        </div>
                    </div>
                    <button className="w-7 h-7 b rounded-sm flex items-center justify-center text-[color:var(--muted)] hover:text-[color:var(--text)]" style={{ background: "var(--panel)" }} title="Copy as cURL">
                        <ICopy s={11} />
                    </button>
                    <button className="w-7 h-7 b rounded-sm flex items-center justify-center text-[color:var(--muted)] hover:text-[color:var(--text)]" style={{ background: "var(--panel)" }} title="Save">
                        <ISave s={11} />
                    </button>
                    {/* Send — orange solid, matches your orange SEND button */}
                    <button className="h-7 px-3 flex items-center gap-1.5 mono text-[11px] tracking-[0.14em] font-semibold text-white rounded-sm" style={{ background: "var(--accent)" }}>
                        <IPlay s={10} /> <span>SEND</span>
                    </button>
                </div>
            );
        }

        /* ============================================================
           PANEL HEADER (section caption bar — thin, uppercase, orange dot)
           ============================================================ */
        function PanelHead({ label, count, right }) {
            return (
                <div className="h-7 shrink-0 bb flex items-center justify-between px-2 mono text-[10px] tracking-[0.18em] text-[color:var(--muted)]" style={{ background: "var(--bg-2)" }}>
                    <div className="flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full" style={{ background: "var(--accent)" }} />
                        <span className="uppercase">{label}</span>
                        {count != null && <span className="px-1 text-[9.5px] rounded-sm" style={{ background: "var(--panel)", color: "var(--text)" }}>{count}</span>}
                    </div>
                    <div className="flex items-center gap-0.5">{right}</div>
                </div>
            );
        }
        const TBtn = ({ t, onClick, children }) => (
            <button onClick={onClick} title={t} className="w-5 h-5 flex items-center justify-center text-[color:var(--ghost)] hover:text-[color:var(--text)] hover:bg-[color:var(--panel)] rounded-sm">
                {children}
            </button>
        );

        /* ============================================================
           HISTORY PANEL (left column)
           ============================================================ */
        function HistoryPanel() {
            const items = [
                { m: "POST", c: "#f97316", p: "/v2/users/42/profile", n: "admin injection probe", t: "2m", code: 200, tier: "ok" },
                { m: "GET", c: "#22c55e", p: "/v2/users?q=*", n: "enum users", t: "4m", code: 200, tier: "ok" },
                { m: "POST", c: "#f97316", p: "/auth/login", n: "credential spray", t: "11m", code: 401, tier: "client" },
                { m: "GET", c: "#22c55e", p: "/.git/config", n: "source disclosure", t: "18m", code: 403, tier: "client" },
                { m: "PUT", c: "#3b82f6", p: "/v2/users/42", n: "role escalation", t: "22m", code: 500, tier: "server" },
                { m: "DEL", c: "#ef4444", p: "/v2/sessions/current", n: "CSRF test", t: "31m", code: 204, tier: "ok" },
                { m: "POST", c: "#f97316", p: "/graphql", n: "introspection", t: "1h", code: 200, tier: "ok" },
                { m: "GET", c: "#22c55e", p: "/admin", n: "access control", t: "1h", code: 302, tier: "redir" },
                { m: "PATCH", c: "#a855f7", p: "/v2/orders/9001", n: "idor test", t: "3h", code: 200, tier: "ok" },
            ];
            const tierDot = { ok: "#22c55e", redir: "#3b82f6", client: "#eab308", server: "#ef4444" };
            return (
                <div className="flex flex-col min-h-0 min-w-0" style={{ background: "var(--bg)" }}>
                    <PanelHead label="HISTORY" count={items.length} right={
                        <>
                            <TBtn t="New"><IPlus s={10} /></TBtn>
                            <TBtn t="Search"><ISearch s={10} /></TBtn>
                        </>
                    } />
                    <div className="p-1.5 bb">
                        <div className="h-6 px-1.5 flex items-center gap-1 b rounded-sm" style={{ background: "var(--panel)" }}>
                            <ISearch s={10} cls="text-[color:var(--ghost)]" />
                            <input placeholder="filter history…" className="flex-1 bg-transparent outline-none text-[10.5px] placeholder-[color:var(--ghost)]" />
                            <span className="mono text-[9px] text-[color:var(--ghost)]">⌘F</span>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto">
                        {items.map((r, i) => (
                            <button key={i} className={
                                "w-full text-left px-2 py-1.5 flex items-start gap-1.5 bb " +
                                (i === 0 ? "" : "hover:bg-[color:var(--panel)]")
                            } style={i === 0 ? { background: "rgba(249,115,22,0.08)", borderLeft: "2px solid var(--accent)" } : { borderLeft: "2px solid transparent" }}>
                                <span className="mt-[5px] w-[5px] h-[5px] rounded-full shrink-0" style={{ background: tierDot[r.tier] }} />
                                <div className="min-w-0 flex-1">
                                    <div className="flex items-center gap-1.5 mono text-[10.5px]">
                                        <span className="font-bold" style={{ color: r.c }}>{r.m}</span>
                                        <span className="text-[color:var(--text)] truncate">{r.p}</span>
                                    </div>
                                    <div className="flex items-center justify-between mt-0.5">
                                        <span className="text-[10px] text-[color:var(--muted)] truncate">{r.n}</span>
                                        <span className="mono text-[9.5px] text-[color:var(--ghost)] shrink-0 ml-1">{r.code} · {r.t}</span>
                                    </div>
                                </div>
                            </button>
                        ))}
                    </div>
                    <div className="h-6 shrink-0 bt px-2 flex items-center justify-between mono text-[9.5px] text-[color:var(--muted)]" style={{ background: "var(--bg-2)" }}>
                        <span>9 reqs</span><span>6 · 2 · 1</span>
                    </div>
                </div>
            );
        }

        /* ============================================================
           KV TABLE (Headers / Params / Env Vars)
           ============================================================ */
        function KvTable({ rows, setRows, kp = "key", vp = "value" }) {
            const up = (i, f, v) => { const n = rows.slice(); n[i] = { ...n[i], [f]: v }; setRows(n); };
            const tg = i => up(i, "on", !rows[i].on);
            const rm = i => setRows(rows.filter((_, j) => j !== i));
            const add = () => setRows([...rows, { on: true, k: "", v: "" }]);
            return (
                <div className="flex-1 min-h-0 overflow-auto" style={{ background: "var(--bg)" }}>
                    <table className="w-full mono text-[11.5px] border-collapse">
                        <thead className="sticky top-0 z-10" style={{ background: "var(--bg-2)" }}>

                                            style={{ borderColor: "var(--line)", background: "var(--bg-2)" }}>{g.g.toUpperCase()}</div>
                                        {g.items.map((m, i) => (
                                            <div key={i} className="px-2 py-1.5 bb flex items-center gap-2" style={{ borderColor: "var(--line)" }}>
                                                <div className="flex-1 min-w-0">
                                                    <div className="mono text-[11.5px] truncate">{m.n}</div>
                                                    <div className="mono text-[9.5px] text-[color:var(--muted)] truncate">{m.src}</div>
                                                </div>
                                                <span className="w-7 h-3.5 rounded-full flex items-center shrink-0"
                                                    style={{ background: m.on ? "var(--accent)" : "var(--panel)" }}>
                                                    <span className="w-3 h-3 rounded-full bg-white"
                                                        style={{ marginLeft: m.on ? "14px" : "2px", transition: "margin .15s" }} />
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                            <div className="shrink-0 bt p-2" style={{ borderColor: "var(--line)", background: "var(--bg-2)" }}>
                                <div className="mono text-[9.5px] tracking-[0.2em] text-[color:var(--muted)] mb-1">THROTTLE</div>
                                <div className="h-1 w-full rounded-sm" style={{ background: "var(--panel)" }}>
                                    <div className="h-full rounded-sm" style={{ width: "40%", background: "var(--accent)" }} />
                                </div>
                                <div className="flex items-center justify-between mt-1">
                                    <span className="mono text-[10px] text-[color:var(--muted)]">40 req/s</span>
                                    <span className="mono text-[10px] text-[color:var(--muted)]">stealth: on</span>
                                </div>
                            </div>
                        </div>
                        <div className="hairline" />

                        {/* subdomains table col */}
                        <div className="flex flex-col min-h-0" style={{ background: "var(--bg)" }}>
                            <SectionCap label="SUBDOMAINS" sub={`${subs.length} rows · live 11 · dead 1`}
                                right={<div className="flex items-center gap-1">
                                    {["ALL", "LIVE", "DEAD", "PRIV"].map((f, i) => (
                                        <button key={f} className="h-5 px-1.5 mono text-[9.5px] tracking-[0.14em] b rounded-sm"
                                            style={{ background: i === 0 ? "var(--panel)" : "transparent", color: i === 0 ? "var(--text)" : "var(--muted)" }}>
                                            {f}
                                        </button>
                                    ))}
                                    <input placeholder="filter…" className="h-5 w-24 px-1.5 b rounded-sm mono text-[10px] bg-[color:var(--panel)] outline-none" />
                                </div>} />
                            <div className="grid shrink-0 bb" style={{
                                gridTemplateColumns: "18px 1.4fr 1fr 1.2fr 1.2fr 1fr 52px",
                                background: "var(--bg-2)", borderColor: "var(--line)"
                            }}>
                                {["", "HOST", "IP", "ASN", "SERVER", "PORTS", "SEV"].map((h, i) => (
                                    <div key={i} className="px-2 py-1 mono text-[9.5px] tracking-[0.18em] text-[color:var(--muted)] br"
                                        style={{ borderColor: "var(--line)" }}>{h}</div>
                                ))}
                            </div>
                            <div className="flex-1 min-h-0 overflow-auto">
                                {subs.map((s, i) => (
                                    <div key={i} className="grid bb items-center hover:bg-white/[0.02]"
                                        style={{ gridTemplateColumns: "18px 1.4fr 1fr 1.2fr 1.2fr 1fr 52px", borderColor: "var(--line)" }}>
                                        <div className="px-2 py-1.5 flex items-center justify-center">
                                            <span className="w-1.5 h-1.5 rounded-full" style={{
                                                background: s.t === "live" ? "var(--ok)" : s.t === "dead" ? "var(--muted)" : "var(--warn)"
                                            }} />
                                        </div>
                                        <div className="px-2 py-1.5 mono text-[11px] truncate">{s.h}</div>
                                        <div className="px-2 py-1.5 mono text-[10.5px] text-[color:var(--muted)] tabular-nums">{s.ip}</div>
                                        <div className="px-2 py-1.5 mono text-[10.5px] text-[color:var(--muted)] truncate">{s.a}</div>
                                        <div className="px-2 py-1.5 mono text-[10.5px] truncate">{s.s}</div>
                                        <div className="px-2 py-1.5 mono text-[10.5px] text-[color:var(--muted)] tabular-nums truncate">{s.p}</div>
                                        <div className="px-2 py-1.5 mono text-[10px] text-right" style={{ color: sevColor(s.sev) }}>
                                            {s.sev === "-" ? "—" : s.sev}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="hairline" />

                        {/* right column: tech + ports + leaks */}
                        <div className="flex flex-col min-h-0" style={{ background: "var(--bg)" }}>
                            <SectionCap label="TECH" sub={`${techs.length}`} />
                            <div className="p-2 flex flex-wrap gap-1 shrink-0">
                                {techs.map((t, i) => (
                                    <span key={i} className="b rounded-sm px-1.5 py-0.5 mono text-[10px] bg-[color:var(--panel)]"
                                        style={{ borderColor: "var(--line)" }}>{t}</span>
                                ))}
                            </div>

                            <SectionCap label="OPEN PORTS" sub="412 across 71 ips" />
                            <div className="shrink-0">
                                {ports.map((p, i) => (
                                    <div key={i} className="px-2 py-1.5 bb flex items-center gap-2" style={{ borderColor: "var(--line)" }}>
                                        <span className="mono text-[11.5px] tabular-nums w-10">{p.p}</span>
                                        <span className="mono text-[10.5px] text-[color:var(--muted)] flex-1 truncate">{p.s.split(" · ")[0]}</span>
                                        <div className="flex-1 h-1 rounded-sm" style={{ background: "var(--panel)" }}>
                                            <div className="h-full rounded-sm" style={{ width: `${Math.min(100, parseInt(p.s.split("· ")[1]) * 12)}%`, background: "var(--accent)" }} />
                                        </div>
                                        <span className="mono text-[10px] text-[color:var(--muted)] w-6 text-right">{p.s.split("· ")[1]}</span>
                                    </div>
                                ))}
                            </div>

                            <SectionCap dot="var(--err)" label="LEAKS & SECRETS" sub="3 hits" />
                            <div className="flex-1 min-h-0 overflow-auto">
                                {leaks.map((l, i) => (
                                    <div key={i} className="px-2 py-1.5 bb" style={{ borderColor: "var(--line)" }}>
                                        <div className="flex items-center gap-2">
                                            <span className="mono text-[9.5px] tracking-[0.16em] text-[color:var(--err)] w-14">{l.src.toUpperCase()}</span>
                                            <span className="mono text-[11px] flex-1 truncate">{l.v}</span>
                                            <span className="mono text-[10px] text-[color:var(--muted)]">{l.t}</span>
                                        </div>
                                    </div>
                                ))}
                                <div className="p-2 mono text-[10px] text-[color:var(--muted)]">
                                    Passive sources queried: crt.sh · virustotal · otx · hibp · dehashed · github
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================================================
           APP
           ============================================================ */
        function App() {
            const [tab, setTab] = useState("studio");
            const [running] = useState(false);
            return (
                <div className="h-full w-full flex flex-col">
                    <TitleBar tab={tab} setTab={setTab} running={running} />
                    {tab === "basic" && <BasicView />}
                    {tab === "studio" && <StudioView />}
                    {tab === "recon" && <ReconView />}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
