name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (incl. precision corpus)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build workspace
        run: cargo build --workspace --locked

      # The precision corpus (secrets/tests/precision_corpus.rs) runs as part of the
      # workspace test set. A regression in the false-positive / false-negative count
      # fails this job — that is the gate behind the "Zero-FP" number.
      - name: Test workspace
        run: cargo test --workspace --locked
