name: Release Arkenar

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  # ── 1. Create the GitHub Release ──────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Arkenar ${{ github.ref_name }}

          ### Install (CLI)
          - **Linux / macOS:** `curl -sL https://raw.githubusercontent.com/REPO/main/install.sh | bash`
          - **Windows:** `irm https://raw.githubusercontent.com/REPO/main/install.ps1 | iex`

          See the [CHANGELOG](https://github.com/REPO/blob/main/CHANGELOG.md) for what's new.
          EOF
          sed -i "s|REPO|${{ github.repository }}|g" notes.md
          PRE=""
          case "${{ github.ref_name }}" in *-beta*|*-rc*) PRE="--prerelease";; esac
          gh release create "${{ github.ref_name }}" \
            --title "Arkenar ${{ github.ref_name }}" \
            --notes-file notes.md $PRE || echo "release may already exist"

  # ── 2. Build CLI binaries ─────────────────────────────────────────────────
  build-cli:
    name: Build CLI — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: arkenar-windows-amd64.zip
            archive: zip

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: arkenar-linux-amd64.tar.gz
            archive: tar

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: arkenar-linux-arm64.tar.gz
            archive: tar
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: arkenar-macos-amd64.tar.gz
            archive: tar

          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: arkenar-macos-arm64.tar.gz
            archive: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i.bak "0,/^version = \"[^\"]*\"/ s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" core/Cargo.toml
          sed -i.bak "0,/^version = \"[^\"]*\"/ s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" cli/Cargo.toml
          rm -f core/Cargo.toml.bak cli/Cargo.toml.bak

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build CLI binary
        if: matrix.cross != true
        run: cargo build -p arkenar --release --target ${{ matrix.target }}

      - name: Build CLI binary (cross)
        if: matrix.cross == true
        run: cross build -p arkenar --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/arkenar.exe"
          Compress-Archive -Path $bin -DestinationPath ${{ matrix.asset_name }}

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar'
        run: |
          BIN="target/${{ matrix.target }}/release/arkenar"
          tar -czf ${{ matrix.asset_name }} -C "$(dirname $BIN)" "$(basename $BIN)"

      - name: Upload CLI asset to GitHub Release
        run: gh release upload ${{ github.ref_name }} ${{ matrix.asset_name }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
