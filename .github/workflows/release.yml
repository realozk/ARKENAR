name: Release Arkenar GUI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'latest.json'
      - '**.md'
      - '.github/SECURITY.md'
  workflow_dispatch:
    
permissions:
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Auto-bump version & create a git tag
  # ─────────────────────────────────────────────
  bump-version:
    name: Bump version & tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history to find latest tag
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next patch version
        id: bump
        run: |
          # Get the latest semver tag (e.g. v1.1.2); fall back to v0.0.0
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                    | sort -V | tail -1)
          LATEST=${LATEST:-v0.0.0}

          # Split into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          # Bump patch
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "Latest tag : $LATEST"
          echo "New tag    : $NEW_TAG"

          echo "tag=$NEW_TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in tauri.conf.json
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          # Use node (always available on ubuntu runners) for reliable JSON edit
          node -e "
            const fs = require('fs');
            const p = 'gui/src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Update version in Cargo.toml files
        run: |
          VERSION="${{ steps.bump.outputs.version }}"

          # 1. core/Cargo.toml — package version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" core/Cargo.toml

          # 2. cli/Cargo.toml — package version + arkenar-core path dep version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          sed -i "s/arkenar-core = { version = \"[^\"]*\"/arkenar-core = { version = \"$VERSION\"/" cli/Cargo.toml

          # 3. gui/src-tauri/Cargo.toml — package version + arkenar-core path dep version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" gui/src-tauri/Cargo.toml
          sed -i "s/arkenar-core = { version = \"[^\"]*\"/arkenar-core = { version = \"$VERSION\"/" gui/src-tauri/Cargo.toml

      - name: Install Rust stable (for cargo fetch)
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Cargo.lock
        run: cargo fetch --manifest-path Cargo.toml

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gui/src-tauri/tauri.conf.json \
                  gui/src-tauri/Cargo.toml \
                  core/Cargo.toml \
                  cli/Cargo.toml \
                  Cargo.lock
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Create & push git tag
        run: |
          git tag ${{ steps.bump.outputs.tag }}
          git push origin ${{ steps.bump.outputs.tag }}

  # ─────────────────────────────────────────────
  # 2. Build GUI (Tauri) for all platforms
  # ─────────────────────────────────────────────
  build-tauri:
    name: Build GUI — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: bump-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest

    steps:
      - name: Checkout (at new tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
           TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: gui
          tagName: ${{ needs.bump-version.outputs.tag }}
          releaseName: "Arkenar ${{ needs.bump-version.outputs.tag }}"
          releaseBody: |
            ## Arkenar ${{ needs.bump-version.outputs.tag }}

            ### Downloads

            #### GUI (Desktop App)
            | Platform | File |
            |----------|------|
            | Windows  | `Arkenar_*_x64-setup.exe` (NSIS installer, no admin required) |
            | Linux    | `arkenar_*_amd64.AppImage` or `arkenar_*_amd64.deb` |
            | macOS    | `Arkenar_*_universal.dmg` |

            #### CLI (Command Line)
            | Platform | One-command install |
            |----------|---------------------|
            | Windows  | `irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 \| iex` |
            | Linux / macOS | `curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh \| bash` |

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.
          releaseDraft: false
          prerelease: false

  # ─────────────────────────────────────────────
  # 3. Update latest.json directly on main
  # ─────────────────────────────────────────────
  update-latest-json:
    name: Update latest.json
    runs-on: ubuntu-22.04
    needs: [bump-version, build-tauri]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build latest.json from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-version.outputs.tag }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          fetch_sig() {
            local asset="$1"
            gh release download "$TAG" --repo "$REPO" --pattern "${asset}.sig" --output - 2>/dev/null || echo ""
          }

          WIN_ASSET="Arkenar_${VERSION}_x64-setup.exe"
          LINUX_ASSET="arkenar_${VERSION}_amd64.AppImage"
          MAC_X64_ASSET="Arkenar_${VERSION}_x64.dmg"
          MAC_ARM_ASSET="Arkenar_${VERSION}_aarch64.dmg"

          WIN_SIG=$(fetch_sig "$WIN_ASSET")
          LINUX_SIG=$(fetch_sig "$LINUX_ASSET")
          MAC_X64_SIG=$(fetch_sig "$MAC_X64_ASSET")
          MAC_ARM_SIG=$(fetch_sig "$MAC_ARM_ASSET")

          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the CHANGELOG for details.",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE}/${WIN_ASSET}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE}/${LINUX_ASSET}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE}/${MAC_X64_ASSET}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "${BASE}/${MAC_ARM_ASSET}"
              }
            }
          }
          EOF

      - name: Commit latest.json directly to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet && echo "No changes to latest.json" && exit 0
          git commit -m "chore: update latest.json for ${{ needs.bump-version.outputs.tag }} [skip ci]"
          git push origin main

  # ─────────────────────────────────────────────
  # 4. Build CLI binaries
  # ─────────────────────────────────────────────
  build-cli:
    name: Build CLI — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [bump-version, build-tauri]

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: arkenar-windows-amd64.zip
            archive: zip

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: arkenar-linux-amd64.tar.gz
            archive: tar

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: arkenar-linux-arm64.tar.gz
            archive: tar
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: arkenar-macos-amd64.tar.gz
            archive: tar

          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: arkenar-macos-arm64.tar.gz
            archive: tar

    steps:
      - name: Checkout (at new tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build CLI binary
        if: matrix.cross != true
        run: cargo build -p arkenar --release --target ${{ matrix.target }}

      - name: Build CLI binary (cross)
        if: matrix.cross == true
        run: cross build -p arkenar --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/arkenar.exe"
          Compress-Archive -Path $bin -DestinationPath ${{ matrix.asset_name }}

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar'
        run: |
          BIN="target/${{ matrix.target }}/release/arkenar"
          tar -czf ${{ matrix.asset_name }} -C "$(dirname $BIN)" "$(basename $BIN)"

      - name: Upload CLI asset to GitHub Release
        run: gh release upload ${{ needs.bump-version.outputs.tag }} ${{ matrix.asset_name }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
